name: Release firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ADF_REPO: https://github.com/espressif/esp-adf.git
  ADF_COMMIT: fcce23e3

jobs:
  firmware:
    name: Build ESP32 slave firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch ESP-ADF (pinned)
        run: |
          git clone --filter=blob:none "$ADF_REPO" /opt/esp-adf
          git -C /opt/esp-adf checkout "$ADF_COMMIT"
          # audio_recorder requires esp-sr, so both submodules are needed
          git -C /opt/esp-adf submodule update --init components/esp-adf-libs components/esp-sr

      - name: Build
        run: |
          source "$IDF_PATH/export.sh"
          export ADF_PATH=/opt/esp-adf
          export IDF_TARGET=esp32
          idf.py build

      - name: Package
        run: |
          source "$IDF_PATH/export.sh"
          mkdir -p out
          cp build/Ford-DensO-bluetooth-slave.bin out/
          cp build/bootloader/bootloader.bin out/
          cp build/partition_table/partition-table.bin out/
          cp build/ota_data_initial.bin out/
          python -m esptool --chip esp32 merge_bin \
            -o out/Ford-DensO-bluetooth-slave-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0xf000  build/ota_data_initial.bin \
            0x20000 build/Ford-DensO-bluetooth-slave.bin
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: slave-firmware
          path: out/*

  release:
    name: Publish release
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Ford Player — Slave firmware (ESP32 A2DP)

            **Files**
            - `Ford-DensO-bluetooth-slave-full.bin` — single image, flash at `0x0`
            - `Ford-DensO-bluetooth-slave.bin` — app image for OTA from the master

            **Flash**
            ```bash
            esptool.py --chip esp32 -p /dev/ttyUSB0 -b 921600 write_flash 0x0 Ford-DensO-bluetooth-slave-full.bin
            ```
